name: Deploy merged course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: course/package-lock.json

      # `npm ci` fails here: the repo root defines `course` as an npm
      # workspace but has no root package-lock.json (only course/package-lock.json
      # and root bun.lock), so npm ci walks up to the workspace root, finds no
      # lock file, and aborts. `npm install` works correctly from course/.
      - name: Install dependencies
        working-directory: course
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: course
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
